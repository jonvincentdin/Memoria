# Supabase (hosted) PostgreSQL profile
# Activate: SPRING_PROFILES_ACTIVE=supabase
# Then set the three variables below in your environment (never commit real values).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
