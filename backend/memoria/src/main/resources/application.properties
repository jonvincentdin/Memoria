spring.application.name=memoria
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

# ---------------------------------------------------------------
# Default profile: local PostgreSQL (see SETUP.md for how to run)
# Switch to Supabase by exporting the three SPRING_DATASOURCE_*
# environment variables before starting, or activate the
# "supabase" profile: SPRING_PROFILES_ACTIVE=supabase
# ---------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memoria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:memoria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:memoria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Session cookie settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
